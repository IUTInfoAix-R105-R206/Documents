# .github/workflows/build.yml
# Compile les TD en PDF à chaque push et les publie en artefact

name: Build PDFs

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'templates/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'templates/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-french \
            texlive-pictures \
            texlive-science \
            texlive-plain-generic \
            lmodern \
            inkscape

      - name: Install Mocodo (figures MCD)
        run: pipx install "$(grep '^mocodo' requirements.txt)"

      - name: Build all PDFs
        run: make all

      - name: Build teacher PDFs
        run: make teacher

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: td-pdfs
          path: output/**/*.pdf
          retention-days: 30

      # Publication sur GitHub Pages (branche main uniquement)
      - name: Prepare GitHub Pages content
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/pdfs/r1.05 site/pdfs/r2.06
          find output/r1.05 -name "*.pdf" -exec cp {} site/pdfs/r1.05/ \; 2>/dev/null || true
          find output/r2.06 -name "*.pdf" -exec cp {} site/pdfs/r2.06/ \; 2>/dev/null || true
          # Guides pratiques (PDF à la racine de output/)
          find output -maxdepth 1 -name "*.pdf" -exec cp {} site/pdfs/ \; 2>/dev/null || true

      - name: Fetch test reports summary from gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          gh api "repos/${{ github.repository }}/contents/reports/summary.json?ref=gh-pages" \
            --jq '.content' 2>/dev/null | base64 -d > site/reports-summary.json 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate index page
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/generate-index.py \
            --docs-dir docs \
            --pdf-dir site/pdfs \
            --reports-summary site/reports-summary.json \
            --output site/index.html
          rm -f site/reports-summary.json

      - name: Generate statistics page
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/generate-stats.py \
            --docs-dir docs \
            --output site/stats/index.html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
