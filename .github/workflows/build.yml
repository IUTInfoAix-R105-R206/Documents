# .github/workflows/build.yml
# Compile les TD en PDF à chaque push et les publie en artefact

name: Build PDFs

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'templates/**'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'templates/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-french \
            texlive-pictures \
            texlive-science \
            texlive-plain-generic \
            lmodern \
            inkscape

      - name: Build all PDFs
        run: make all

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: td-pdfs
          path: output/**/*.pdf
          retention-days: 30

      # Publication sur GitHub Pages (branche main uniquement)
      - name: Prepare GitHub Pages content
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/pdfs/r1.05 site/pdfs/r2.06
          find output/r1.05 -name "*.pdf" -exec cp {} site/pdfs/r1.05/ \; 2>/dev/null || true
          find output/r2.06 -name "*.pdf" -exec cp {} site/pdfs/r2.06/ \; 2>/dev/null || true
          {
            printf '<!DOCTYPE html>\n<html lang="fr">\n<head>\n'
            printf '<meta charset="UTF-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            printf '<title>Bases de données — TD</title>\n'
            printf '<style>\n'
            printf '  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }\n'
            printf '  h1 { font-size: 1.4rem; }\n'
            printf '  h2 { font-size: 1.2rem; margin-top: 1.5rem; }\n'
            printf '  h3 { font-size: 1rem; margin-top: 1rem; color: #555; }\n'
            printf '  ul { list-style: none; padding: 0; }\n'
            printf '  li { margin: .5rem 0; }\n'
            printf '  a { text-decoration: none; color: #0366d6; }\n'
            printf '  a:hover { text-decoration: underline; }\n'
            printf '</style>\n</head>\n<body>\n'
            printf '<h1>Bases de données — Sujets de TD</h1>\n'

            printf '<h2>R1.05 — Introduction aux bases de données et SQL</h2>\n'
            printf '<ul>\n'
            for pdf in site/pdfs/r1.05/*.pdf; do
              [ -f "$pdf" ] || continue
              name=$(basename "$pdf")
              printf '  <li><a href="pdfs/r1.05/%s">%s</a></li>\n' "$name" "$name"
            done
            printf '</ul>\n'

            printf '<h2>R2.06 — Exploitation d'\''une base de données</h2>\n'
            printf '<ul>\n'
            for pdf in site/pdfs/r2.06/*.pdf; do
              [ -f "$pdf" ] || continue
              name=$(basename "$pdf")
              printf '  <li><a href="pdfs/r2.06/%s">%s</a></li>\n' "$name" "$name"
            done
            printf '</ul>\n'

            printf '<h2>Tests SQL</h2>\n'
            printf '<ul>\n'
            printf '  <li><a href="reports/">Rapport multi-SGBD (PostgreSQL, SQLite, Oracle)</a></li>\n'
            printf '</ul>\n'
            printf '</body>\n</html>\n'
          } > site/index.html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
