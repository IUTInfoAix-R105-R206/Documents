# .github/workflows/publish-web-td.yml
# Publie automatiquement les pages web des TD dans leurs dépôts étudiants.
# Inspiré du dépôt classroom-sync (sync config-driven via PAT cross-dépôt).
#
# CHAÎNAGE : ce workflow se déclenche APRÈS « Build PDFs » (build.yml) via
# workflow_run. Il réutilise ainsi l'artefact « td-pdfs » produit par build.yml
# (aucune recompilation LaTeX ici) : chaque PDF sujet est copié dans la page et
# lié (« Ouvrir le sujet »), utile quand le dépôt Documents deviendra privé.
#
# PRÉ-REQUIS (une fois) : créer un secret « PUBLISH_TOKEN » dans ce dépôt
# (Settings > Secrets and variables > Actions), contenant un jeton d'accès (PAT)
# autorisé en écriture (Contents: write) sur les dépôts
# IUTInfoAix-R105/TD1, /TD2, /TD6, /TD7 :
#   - PAT classique avec le scope « repo », OU
#   - PAT fine-grained limité à ces dépôts avec « Contents: Read and write ».
# Sans ce secret, le job échoue avec un message explicite.
#
# Chaque page publiée déclenche le workflow de déploiement Pages de son dépôt.

name: Publish web TD pages

on:
  # Déclenchement manuel (avec option dry-run) : récupère le dernier artefact PDF.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (ne rien pousser, juste rapporter les changements)"
        type: boolean
        default: false

  # Déclenchement automatique : après chaque build PDF réussi sur main.
  workflow_run:
    workflows: ["Build PDFs"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read   # nécessaire pour télécharger l'artefact « td-pdfs » du run build.yml

# Une seule publication à la fois (évite les pushs concurrents vers un même dépôt).
concurrency:
  group: publish-web-td
  cancel-in-progress: false

jobs:
  publish:
    # Sur workflow_run : uniquement si le build a réussi et vient d'un push / dispatch
    # sur main. Sur workflow_dispatch : toujours.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           (github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier la présence du secret PUBLISH_TOKEN
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Secret PUBLISH_TOKEN manquant. Créez un PAT (Contents: write sur TD1/TD2/TD6/TD7) et ajoutez-le en secret Actions nommé PUBLISH_TOKEN."
            exit 1
          fi

      - name: Configurer git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Récupérer les PDF sujets (artefact du build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Run à consulter : celui qui a déclenché (workflow_run), sinon le dernier build réussi.
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow "Build PDFs" --branch main --status success \
                       --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          fi
          echo "Artefact td-pdfs depuis le run ${RUN_ID:-<aucun>}"
          if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" -n td-pdfs -D pdf-artifact 2>/dev/null; then
            for td in td1 td2 td3 td4 td5 td6 td7; do
              mkdir -p "output/r1.05/$td"
              f=$(find pdf-artifact -name "$td.pdf" 2>/dev/null | head -1 || true)
              if [ -n "$f" ]; then cp "$f" "output/r1.05/$td/$td.pdf"; echo "  PDF $td <- $f"; fi
            done
          else
            echo "::warning::Artefact td-pdfs indisponible - publication SANS mise a jour du PDF (le PDF deja present dans chaque depot est preserve)."
          fi

      - name: Publier toutes les pages TD
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          DRY_RUN: ${{ (inputs.dry_run && '1') || '0' }}
        run: |
          set -euo pipefail
          ORG=IUTInfoAix-R105
          if [ "$DRY_RUN" = "1" ]; then MODE="dry-run (aucun push)"; else MODE="live"; fi

          clone() { rm -rf "/tmp/$1"; git clone "https://x-access-token:${PUBLISH_TOKEN}@github.com/${ORG}/$1.git" "/tmp/$1"; }
          publish() {  # <label> <make-target> <VAR=path>
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            make "$2" "$3" 2>&1 | tail -4 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }

          printf '## Publication des pages web TD\n\n- Mode : %s\n\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"

          clone TD6; publish "TD6 (SQL)"        publish-web-td6         WEB_TD6_REPO=/tmp/TD6
          clone TD7; publish "TD7 (SQL)"        publish-web-td7         WEB_TD7_REPO=/tmp/TD7
          clone TD1; publish "TD1 (algèbre)"    publish-web-td1-algebre WEB_TD1_ALGEBRE_REPO=/tmp/TD1
          clone TD2
          publish "TD2 airbase"     publish-web-td2-airbase   WEB_TD2_REPO=/tmp/TD2
          publish "TD2 immobilier"  publish-web-td2-immobilier WEB_TD2_REPO=/tmp/TD2
          # Pages minimales (lien PDF seul) : TD3/TD4/TD5.
          clone TD3; publish "TD3 (PDF)"        publish-web-td3         WEB_TD3_REPO=/tmp/TD3
          clone TD4; publish "TD4 (PDF)"        publish-web-td4         WEB_TD4_REPO=/tmp/TD4
          clone TD5; publish "TD5 (PDF)"        publish-web-td5         WEB_TD5_REPO=/tmp/TD5
