# .github/workflows/test-sql.yml
# Valide les corrections SQL contre le jeu de données de test
# Utilise PostgreSQL pour la CI (léger et rapide)
# Note : certaines requêtes Oracle-spécifiques peuvent nécessiter des adaptations

name: Test SQL Corrections

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*correction*.sql'
      - 'docs/shared/data/**'
      - 'scripts/test-sql.sh'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*correction*.sql'
      - 'docs/shared/data/**'

jobs:
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gestion_pedagogique
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: gestion_pedagogique

    steps:
      - uses: actions/checkout@v4

      - name: Load schema and test data
        run: |
          psql -h localhost -U test -d gestion_pedagogique \
            -f docs/shared/data/schema.sql
          psql -h localhost -U test -d gestion_pedagogique \
            -f docs/shared/data/insert.sql

      - name: Run SQL tests
        run: |
          chmod +x scripts/test-sql.sh
          ./scripts/test-sql.sh postgres

