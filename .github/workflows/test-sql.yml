# .github/workflows/test-sql.yml
# Valide les corrections SQL sur PostgreSQL et SQLite, puis génère un rapport HTML.

name: Test SQL Corrections

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'docs/**/*correction*.sql'
      - 'docs/shared/data/**'
      - 'scripts/test-sql.py'
      - 'scripts/generate-sql-report.py'
      - 'scripts/generate-questions.py'
      - '.sqlfluff'
      - '.sqlfluffignore'
      - '.github/workflows/test-sql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*correction*.sql'
      - 'docs/shared/data/**'
      - 'scripts/test-sql.py'
      - 'scripts/generate-sql-report.py'
      - 'scripts/generate-questions.py'
      - '.sqlfluff'
      - '.sqlfluffignore'
      - '.github/workflows/test-sql.yml'

jobs:

  # ── 0. Lint SQL (SQLFluff) ──────────────────────────────────────────────────
  lint-sql:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SQLFluff
        run: pip install sqlfluff==3.3.1

      - name: Lint SQL corrections
        run: sqlfluff lint docs/

  # ── 1. Tests PostgreSQL ────────────────────────────────────────────────────
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gestion_pedagogique
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: gestion_pedagogique

    steps:
      - uses: actions/checkout@v4

      - name: Run SQL tests (PostgreSQL)
        # || true : certaines requêtes utilisent des syntaxes Oracle-only (MINUS, etc.)
        run: make test-sql-postgresql-local REPORT=results-postgres.csv || true

      - name: Upload PostgreSQL results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-postgres
          path: results-postgres.csv

  # ── 2. Tests SQLite ────────────────────────────────────────────────────────
  test-sqlite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-sqlite3-${{ hashFiles('.github/workflows/test-sql.yml') }}
          restore-keys: ${{ runner.os }}-apt-sqlite3-

      - name: Install sqlite3
        run: sudo apt-get install -y sqlite3

      - name: Run SQL tests (SQLite)
        # || true : certaines requêtes utilisent des syntaxes non supportées par SQLite
        run: make test-sql-sqlite-local REPORT=results-sqlite.csv || true

      - name: Upload SQLite results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-sqlite
          path: results-sqlite.csv

  # ── 3. Tests Oracle ────────────────────────────────────────────────────────
  # Le script Python tourne sur le runner et communique avec sqlplus
  # dans le conteneur via docker exec (ORACLE_DOCKER_CONTAINER).
  test-oracle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Oracle Free Docker image
        uses: actions/cache@v4
        id: cache-oracle
        with:
          path: /tmp/docker-oracle-free.tar
          key: docker-gvenzl-oracle-free-23.5

      - name: Load or pull Oracle Free image
        run: |
          if [ -f /tmp/docker-oracle-free.tar ]; then
            echo "Chargement de l'image Oracle depuis le cache..."
            docker load --input /tmp/docker-oracle-free.tar
          else
            echo "Téléchargement de l'image Oracle depuis Docker Hub..."
            docker pull gvenzl/oracle-free:23.5
            docker save gvenzl/oracle-free:23.5 --output /tmp/docker-oracle-free.tar
          fi

      - name: Start Oracle Free container
        run: |
          docker run -d --name oracle-test \
            -e ORACLE_PASSWORD=test \
            -e APP_USER=testuser \
            -e APP_USER_PASSWORD=test \
            gvenzl/oracle-free:23.5
          echo "En attente du démarrage d'Oracle Free (~2 min)..."
          for i in $(seq 1 40); do
            docker exec oracle-test healthcheck.sh 2>/dev/null && echo "Oracle prêt." && break || true
            sleep 5
            printf "  %ds...\r" $((i * 5))
          done
          docker exec oracle-test healthcheck.sh || { echo "Timeout : Oracle ne répond pas."; exit 1; }

      - name: Run SQL tests (Oracle)
        env:
          ORACLE_USER: testuser
          ORACLE_PASS: test
          ORACLE_SID: FREEPDB1
          ORACLE_DOCKER_CONTAINER: oracle-test
        run: make test-sql-oracle-local REPORT=results-oracle.csv || true

      - name: Upload Oracle results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-oracle
          path: results-oracle.csv

  # ── 4. Vérification Oracle (gate) ──────────────────────────────────────────
  # Oracle est le SGBD cible pédagogique : toute régression doit être bloquante.
  check-oracle:
    needs: [test-oracle]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Oracle results
        uses: actions/download-artifact@v4
        with:
          name: results-oracle
          path: artifacts/

      - name: Check for Oracle failures
        run: |
          CSV="artifacts/results-oracle.csv"
          if [ ! -f "$CSV" ]; then
            echo "::error::Le rapport Oracle CSV est absent."
            exit 1
          fi

          # Extraire les lignes avec status=fail (séparateur ;)
          FAILURES=$(awk -F';' '$4 == "fail"' "$CSV")
          if [ -n "$FAILURES" ]; then
            echo "::error::Des requêtes Oracle ont échoué :"
            echo "$FAILURES" | while IFS=';' read -r td label dbms st ecols erows acols arows; do
              echo "::error::  $td $label - attendu ${ecols}c × ${erows}r, reçu ${acols}c × ${arows}r"
            done
            exit 1
          fi

          echo "Aucun échec Oracle détecté."

  # ── 5. Génération du rapport HTML ──────────────────────────────────────────
  generate-report:
    needs: [test-postgres, test-sqlite, test-oracle]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download PostgreSQL results
        uses: actions/download-artifact@v4
        with:
          name: results-postgres
          path: artifacts/
        continue-on-error: true

      - name: Download SQLite results
        uses: actions/download-artifact@v4
        with:
          name: results-sqlite
          path: artifacts/
        continue-on-error: true

      - name: Download Oracle results
        uses: actions/download-artifact@v4
        with:
          name: results-oracle
          path: artifacts/
        continue-on-error: true

      - name: Generate HTML reports
        run: |
          python3 scripts/generate-sql-report.py \
            artifacts/results-postgres.csv \
            artifacts/results-sqlite.csv \
            artifacts/results-oracle.csv \
            --docs-dir docs \
            --output-dir site

      - name: Upload HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: sql-reports
          path: site/
          retention-days: 30

      - name: Deploy reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: reports
          keep_files: true

      # Regénérer l'index principal avec les liens vers les rapports
      # NB : les fichiers marqueurs sont créés dans pdf-listing/ (NON déployé)
      # pour éviter d'écraser les vrais PDF sur gh-pages avec des fichiers vides.
      - name: Fetch current PDFs listing from gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p pdf-listing/pdfs/r1.05 pdf-listing/pdfs/r2.06
          gh api "repos/${{ github.repository }}/git/trees/gh-pages?recursive=1" \
            --jq '.tree[] | select(.path | test("^pdfs/.*\\.pdf$")) | .path' 2>/dev/null \
            | while read -r pdf; do touch "pdf-listing/$pdf"; done || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update root index with report links
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p root-site
          python3 scripts/generate-index.py \
            --docs-dir docs \
            --pdf-dir pdf-listing/pdfs \
            --reports-summary site/summary.json \
            --output root-site/index.html

      - name: Deploy updated index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./root-site
          keep_files: true
