# .github/workflows/web-td.yml
# Génère les sites web des TD (SQLite WASM) et prouve que le hash calculé côté
# Python (générateur) est identique au hash calculé côté WASM (navigateur).

name: Web TD (SQLite WASM)

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'docs/r1.05/td7/td7-correction.sql'
      - 'docs/r1.05/td6/td6-correction.sql'
      - 'docs/shared/data/voyages/**'
      - 'docs/shared/data/airbase/**'
      - 'scripts/generate-web-td.py'
      - 'scripts/verify-web-td.mjs'
      - 'scripts/td_correction.py'
      - 'scripts/sqlite_compat.py'
      - 'scripts/webtd_canon.py'
      - 'scripts/generate-web-td-algebra.py'
      - 'scripts/algebra-run.mjs'
      - 'scripts/verify-web-td-algebra.mjs'
      - 'docs/r1.05/td1/td1-correction.md'
      - 'docs/r1.05/td1/web-td.json'
      - 'templates/web-td/**'
      - '.github/workflows/web-td.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/r1.05/td7/td7-correction.sql'
      - 'docs/r1.05/td6/td6-correction.sql'
      - 'docs/shared/data/voyages/**'
      - 'docs/shared/data/airbase/**'
      - 'scripts/generate-web-td.py'
      - 'scripts/verify-web-td.mjs'
      - 'scripts/td_correction.py'
      - 'scripts/sqlite_compat.py'
      - 'scripts/webtd_canon.py'
      - 'scripts/generate-web-td-algebra.py'
      - 'scripts/algebra-run.mjs'
      - 'scripts/verify-web-td-algebra.mjs'
      - 'docs/r1.05/td1/td1-correction.md'
      - 'docs/r1.05/td1/web-td.json'
      - 'templates/web-td/**'
      - '.github/workflows/web-td.yml'

jobs:
  build-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        td: [td6, td7, td1-algebre]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Génère et vérifie le site (hash Python == hash WASM)
        run: make verify-web-${{ matrix.td }}

      - name: Publie le site comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.td }}
          path: output/web/${{ matrix.td }}
          retention-days: 30
