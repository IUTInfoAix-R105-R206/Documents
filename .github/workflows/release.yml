# .github/workflows/release.yml
# Compile les PDF et crée une release GitHub avec archive ZIP à chaque tag de version

name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-french \
            texlive-pictures \
            texlive-science \
            texlive-plain-generic \
            lmodern \
            inkscape

      - name: Build all PDFs
        run: make all

      - name: Build teacher PDFs
        run: make teacher

      - name: Create ZIP archive
        run: cd output && zip -r ../Documents-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            Documents-${{ github.ref_name }}.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
