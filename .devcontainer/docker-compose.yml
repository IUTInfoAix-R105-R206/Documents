services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: gestion_pedagogique
      ORACLE_USER: testuser
      ORACLE_PASS: test
      ORACLE_SID: FREEPDB1
      ORACLE_DOCKER_CONTAINER: oracle

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: gestion_pedagogique
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test"]
      interval: 5s
      timeout: 3s
      retries: 5

  oracle:
    image: gvenzl/oracle-free:23.5
    environment:
      ORACLE_PASSWORD: test
      APP_USER: testuser
      APP_USER_PASSWORD: test
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
